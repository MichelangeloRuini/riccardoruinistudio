<!DOCTYPE html>

<body class="landing-active">

  <div class="custom-cursor">ENTER</div>

  <section class="landing" id="landing">
    <video autoplay muted loop playsinline class="landing-video" data-media-poster="assets/hero-poster.webp">
      <source
        data-media-src-desktop="assets/hero-desktop.mp4"
        data-media-src-mobile="assets/hero-mobile.mp4"
        type="video/mp4"
      />
    </video>
    <script>
      (() => {
        const landingVideo = document.currentScript.previousElementSibling;
        const landingSource = landingVideo.querySelector("source");
        const mobileDevice = window.matchMedia("(max-width: 760px)").matches
          || (navigator.maxTouchPoints > 0 && Math.min(screen.width, screen.height) <= 760);
        const videoAssetUrl = mobileDevice
          ? landingSource.dataset.mediaSrcMobile
          : landingSource.dataset.mediaSrcDesktop;

        landingSource.dataset.mediaSrc = videoAssetUrl;
        RRSMedia.setPoster(landingVideo, "assets/hero-poster.webp");
        RRSMedia.setVideoSource(landingVideo, landingSource, videoAssetUrl);
      })();
    </script>

    <div class="landing-logo">
      <img data-media-src="assets/logo-main.svg" alt="Riccardo Ruini Studio" />
    </div>
  </section>
