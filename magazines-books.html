<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magazines &amp; Books — Riccardo Ruini Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="entered magazines-books-public-page">
  <div class="site">
    <header class="site-header site-header--editorial">
      <div class="site-header-left">
        <a href="index.html?skipLanding=true">
          <img src="assets/logo-main.svg" alt="Riccardo Ruini Studio" class="site-logo" />
        </a>
        <input class="search" type="text" placeholder="SEARCH" aria-label="Search" />
      </div>

      <nav class="site-nav site-nav--editorial" aria-label="Primary navigation">
        <a href="#" class="site-nav-cta">Start a Project</a>
        <a href="index.html?skipLanding=true">Clients</a>
        <a href="campaigns.html">Campaigns</a>
        <a href="films.html">Films</a>
        <a href="brand-identity.html">Visual Identity</a>
        <a href="events.html">Events</a>
        <a href="magazines-books.html" class="active" aria-current="page">Magazines &amp; Books</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <main class="magazines-books-page">
      <section
        class="magazines-books-grid"
        id="magazinesBooksGrid"
        aria-label="Magazines and Books projects"
      ></section>
      <p class="magazines-books-empty" id="magazinesBooksEmpty" hidden>
        No Magazines &amp; Books projects are currently available.
      </p>
    </main>

    <footer class="footer">
      <div class="footer-address">
        <a href="https://www.google.com/maps/search/?api=1&amp;query=Via%20di%20Monserrato%2034%2000186%20Roma%20Italia" target="_blank" rel="noopener noreferrer">
          VIA DI MONSERRATO 34<br>
          00186 ROMA<br>
          ITALIA
        </a>
      </div>

      <div class="footer-social">
        <a href="https://www.instagram.com/riccardoruini?utm_source=ig_web_button_share_sheet&amp;igsh=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener noreferrer">INSTAGRAM</a><br>
        <a href="https://www.linkedin.com/company/riccardo-ruini-studio/posts/?feedView=all" target="_blank" rel="noopener noreferrer">LINKEDIN</a><br>
        <a href="mailto:info@riccardoruinistudio.com">INFO@RICCARDORUINISTUDIO.COM</a>
      </div>

      <div class="footer-legal">
        PRIVACY POLICY<br>
        TERMS AND CONDITIONS<br>
        CAREER
      </div>

      <div class="footer-newsletter">
        <input type="email" placeholder="JOIN OUR NEWSLETTER" aria-label="Newsletter email" />
      </div>

      <div class="footer-logo">
        <img src="assets/ui/logo-footer-01.png" class="footer-logo-frame frame-1" alt="" />
        <img src="assets/ui/logo-footer-02.png" class="footer-logo-frame frame-2" alt="" />
      </div>
    </footer>
  </div>

  <div class="magazines-books-modal" id="magazinesBooksModal" hidden>
    <div class="magazines-books-modal__backdrop" data-magazines-books-close></div>
    <section
      class="magazines-books-modal__content"
      role="dialog"
      aria-modal="true"
      aria-labelledby="magazinesBooksModalTitle"
      tabindex="-1"
    >
      <button
        class="magazines-books-modal__close"
        type="button"
        aria-label="Close Magazines and Books project"
        data-magazines-books-close
      >Close</button>
      <video
        class="magazines-books-modal__video"
        muted
        loop
        playsinline
        controls
        preload="metadata"
      ></video>
      <div class="magazines-books-modal__details">
        <h1 id="magazinesBooksModalTitle"></h1>
        <dl class="magazines-books-modal__credits" id="magazinesBooksModalCredits"></dl>
      </div>
    </section>
  </div>

  <script src="data/campaigns.js"></script>
  <script src="data/portfolio-projects.js"></script>
  <script src="data/magazines-books.js"></script>
  <script src="utils/searchData.js"></script>
  <script src="magazines-books.js"></script>
  <script src="script.js"></script>
</body>
</html>
